<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG</title>
<style>
  /* Same tokens as src/styles.css (dark). Kept inline so Chrome can render this file directly. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; background: oklch(0.245 0.005 85); color: oklch(0.93 0.008 85);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .glow { position: absolute; inset: 0; background: radial-gradient(55% 70% at 78% 95%, oklch(0.57 0.16 277 / 0.4), transparent 70%); }
  .text { position: absolute; left: 72px; top: 92px; width: 520px; }
  .eyebrow { font-size: 18px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.7 0.14 277); }
  h1 { margin: 18px 0 0; font-size: 64px; line-height: 1.05; letter-spacing: -0.02em; color: oklch(0.975 0.006 85); }
  p { margin: 22px 0 0; font-size: 24px; line-height: 1.4; color: oklch(0.75 0.011 85); }
  .brand { position: absolute; left: 72px; bottom: 56px; display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; color: oklch(0.975 0.006 85); }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .shot {
    position: absolute; left: 640px; top: 110px; width: 760px; border-radius: 16px; overflow: hidden;
    border: 1px solid oklch(0.95 0.01 85 / 0.14); box-shadow: 0 40px 80px -30px oklch(0 0 0 / 0.7); background: oklch(0.28 0.005 85);
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="text">
    <div class="eyebrow">macOS · Apple Silicon</div>
    <h1>Claude Code, as a Mac app.</h1>
    <p>A cockpit over the real Claude Code CLI. Your own login, one window per project, every session back after a restart.</p>
  </div>
  <div class="brand"><img src="../public/favicon.svg" alt="" />IDX</div>
  <div class="shot"><img src="../public/img/panels-dark.webp" alt="" /></div>
</body>
</html>
